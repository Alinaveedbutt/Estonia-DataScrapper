version: '3.8'

# No database service — pipeline uses open-data files + Google Sheets only.
services:
  app:
    build: .
    image: estonia-company-data-pipeline:latest
    environment:
      - GOOGLE_SHEETS_WEBHOOK_URL=${GOOGLE_SHEETS_WEBHOOK_URL}
      - GOOGLE_SHEETS_WEBHOOK_SECRET=${GOOGLE_SHEETS_WEBHOOK_SECRET}
      - ESTONIA_LOOKBACK_DAYS=${ESTONIA_LOOKBACK_DAYS:-7}
      - MAX_COMPANIES_PER_RUN=${MAX_COMPANIES_PER_RUN:-200}
      - ESTONIA_DATA_DIR=/usr/src/app/data
    volumes:
      - ./data:/usr/src/app/data
      - ./.env:/usr/src/app/.env:ro
