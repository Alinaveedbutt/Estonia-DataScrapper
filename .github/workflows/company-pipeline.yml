name: Estonia Company Pipeline

on:
  schedule:
    # Daily at 12:00 noon Asia/Karachi (UTC+5) = 07:00 UTC
    # GitHub Actions cron is always UTC: '0 7 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  enrich-companies:
    runs-on: ubuntu-latest
    # General data zip is large; allow time to download + stream-parse
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache open-data dump
        uses: actions/cache@v4
        with:
          path: data
          key: estonia-open-data-${{ github.run_id }}
          restore-keys: |
            estonia-open-data-

      - name: Run Health Check
        env:
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          GOOGLE_SHEETS_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_SECRET }}
        run: npm run health

      - name: Run Pipeline Scan
        env:
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          GOOGLE_SHEETS_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_SECRET }}
          ESTONIA_LOOKBACK_DAYS: '7'
          MAX_COMPANIES_PER_RUN: '500'
          SHEETS_REQUIRE_PHONE: 'true'
          SHEETS_NO_WEBSITE_ONLY: 'true'
        run: npm run scan
